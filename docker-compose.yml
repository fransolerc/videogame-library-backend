services:
  videogame-library-backend:
    build: .
    container_name: videogame-library-backend
    ports:
      - "8080:8080"
    environment:
      # Todas estas se resuelven desde el archivo .env en la raíz del proyecto
      # (Docker Compose lo lee automáticamente). Copia .env.example a .env primero.
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000,http://localhost:5173}
